name: CI Tests

on:
  push:
    branches: [ main, feature/** ]
  pull_request:
    branches: [ main ]

jobs:
  unit-tests:
    name: Unit Tests (Cocotb)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y verilator

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install cocotb pytest numpy pillow scipy

    - name: Run Cocotb unit tests
      working-directory: rtl/sim
      run: make test_all

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-results
        path: rtl/sim/results.xml
        if-no-files-found: ignore

  regression-tests:
    name: Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y verilator

    - name: Install Python dependencies
      run: |
        python -m venv .venv
        source .venv/bin/activate
        pip install --upgrade pip
        pip install cocotb numpy pillow scipy

    - name: Run regression tests
      run: |
        source .venv/bin/activate
        python3 run_regression_tests.py

    - name: Upload regression results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: regression-results
        path: |
          regression_results/
          *.log
        if-no-files-found: ignore
